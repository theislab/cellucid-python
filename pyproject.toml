[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cellucid"
version = "0.9.1"  # CELLUCID_VERSION
description = "Interactive Single-Cell Data Visualization"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Kemal Inecik", email = "k.inecik@gmail.com" },
]
maintainers = [
    { name = "Kemal Inecik", email = "k.inecik@gmail.com" },
]
keywords = [
    "single-cell",
    "visualization",
    "umap",
    "3d",
    "webgl",
    "scRNA-seq",
    "bioinformatics",
    "anndata",
    "jupyter",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1.0,!=2.1.2,<3",
    "scipy>=1.12,!=1.17.0,<2",
    "tqdm>=4.45",
    "anndata>=0.12.19,<0.13",
    "zarr>=3.1.4,<4",
    "numcodecs>=0.16.3,<0.17",
    "ipython>=7.23",
    "jupyter-server-proxy>=4.1",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
    "Framework :: Jupyter",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Linters are pinned to an exact version, and the docs extra already pins
    # Sphinx the same way. A floor lets CI install whatever shipped that morning,
    # and every ruff release adds rules: the gate then turns red on a commit that
    # changed nothing, which teaches maintainers that red means "ignore me".
    # Bumping these is a deliberate commit that fixes what the new version finds.
    "ruff==0.16.1",
    "mypy==2.3.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7.2,<8.1",
    "myst-nb>=1.1.0",
    "sphinx-autodoc-typehints>=1.25",
    "pydata-sphinx-theme>=0.15",
    "sphinx-design>=0.5",
    "sphinx-copybutton>=0.5",
]

[project.scripts]
# Main unified CLI entry point
cellucid = "cellucid.cli:main"

[project.urls]
Homepage = "https://github.com/theislab/cellucid-python"
Repository = "https://github.com/theislab/cellucid-python"
Documentation = "https://cellucid.readthedocs.io"
Issues = "https://github.com/theislab/cellucid-python/issues"
Changelog = "https://github.com/theislab/cellucid-python/blob/main/CHANGELOG.md"
Contributing = "https://github.com/theislab/cellucid-python/blob/main/CONTRIBUTING.md"
"Code of Conduct" = "https://github.com/theislab/cellucid-python/blob/main/CODE_OF_CONDUCT.md"
"Security Policy" = "https://github.com/theislab/cellucid-python/blob/main/SECURITY.md"
Support = "https://github.com/theislab/cellucid-python/blob/main/SUPPORT.md"
Citation = "https://github.com/theislab/cellucid-python/blob/main/CITATION.cff"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cellucid = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["cellucid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/cellucid"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
