{% set name = "cellucid" %}
{% set version = "0.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/cellucid-{{ version }}.tar.gz
  sha256: 2fb077dbad5ff8b25a67a38f6a14d2abd943320c9f7b621cc3fdb7248303a53a

build:
  entry_points:
    - cellucid = cellucid.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.11,<3.15
    - setuptools ==83.0.0
    - pip
  run:
    - python >=3.11,<3.15
    - numpy >=1.26,<3
    - pandas >=2.1.0,!=2.1.2,<3
    - scipy >=1.12,!=1.17.0,<2
    - tqdm >=4.45
    - anndata >=0.12.19,<0.13
    - zarr >=3.1.4,<4
    - numcodecs >=0.16.3,<0.17
    - ipython >=7.23
    - jupyter-server-proxy >=4.1

test:
  imports:
    - cellucid
  commands:
    - pip check
    - python -c "import cellucid; assert cellucid.__version__ == '{{ version }}'"
    - cellucid --help
  requires:
    - pip

about:
  home: https://github.com/theislab/cellucid-python
  summary: Interactive Single-Cell Data Visualization
  description: See every cell. Query any gene. Fly through millions. GPU-accelerated WebGL rendering for 2D/3D embeddings with AnnData-first workflow and Jupyter integration.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/theislab/cellucid-python
  doc_url: https://cellucid.readthedocs.io

extra:
  recipe-maintainers:
    - inecik
