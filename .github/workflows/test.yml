name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"

    # This repository is checked out beside its siblings (cellucid-r and the
    # web app), as the workspace holds them locally, so the tests that compare
    # with them (tests/_web_root.py) run here instead of skipping.
    defaults:
      run:
        working-directory: cellucid-python

    env:
      # A sibling checkout or Node missing fails the cross-repository tests
      # instead of skipping them.
      CELLUCID_SIBLINGS_REQUIRED: "1"

    steps:
      - name: Check out the exact source
        uses: actions/checkout@v7
        with:
          path: cellucid-python

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: cellucid-python/pyproject.toml

      # The web app's generators and readers the tests run need its Node.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The siblings' main, checked out after the install so that a day's
      # pushes of the three repositories, made together, have all landed:
      # cellucid-r's sources and fixtures (R twins, cross-writer stores), and
      # the web app's modules (with the libraries, codecs and workers they
      # import), generators and shared fixtures.
      - name: Check out cellucid-r for the R twins and cross-writer stores
        uses: actions/checkout@v7
        with:
          repository: theislab/cellucid-r
          path: cellucid-r

      - name: Check out the web app's modules, generators and shared fixtures
        uses: actions/checkout@v7
        with:
          repository: theislab/cellucid
          path: cellucid
          filter: blob:none
          sparse-checkout: |
            assets/external/
            assets/js/
            assets/wasm/
            assets/workers/
            scripts/
            tests/fixtures/
          sparse-checkout-cone-mode: false

      - name: Run the complete test suite
        run: python -m pytest

      - name: Check source and tests
        run: python -m ruff check src tests

      - name: Check package typing
        run: python -m mypy src/cellucid

      - name: Build and verify both distributions
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          python -m pip install "build==1.5.0" "twine==6.2.0"
          python -m build
          python scripts/normalize_sdist.py dist
          python scripts/validate_release.py --sdist dist
          python -m twine check --strict dist/*
